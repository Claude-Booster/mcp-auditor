# Copy to .github/workflows/lint.yml in a repo to lint on PRs and pushes to main.
# Auto-detects Python (ruff) and/or Node (eslint + tsc).
name: Lint
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    uses: fredman08/ci-workflows/.github/workflows/lint.yml@main
    with:
      soft-fail: true   # report-only by default; set false for a hard gate once the repo is clean
